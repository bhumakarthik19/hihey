<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiHey - Secure Messaging</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">👋 HiHey</div>
            <h1>Welcome to HiHey</h1>
            <p>Secure messaging with end-to-end encryption</p>
            
            <div class="login-options">
                <button class="oauth-btn google-btn" onclick="loginWithGoogle()">
                    <span class="icon">🔵</span> Login with Google
                </button>
                <button class="oauth-btn apple-btn" onclick="loginWithApple()">
                    <span class="icon">🍎</span> Login with Apple
                </button>
                <button class="oauth-btn microsoft-btn" onclick="loginWithMicrosoft()">
                    <span class="icon">💻</span> Login with Microsoft
                </button>
            </div>
            
            <div class="divider">OR</div>
            
            <form id="emailLoginForm" onsubmit="loginWithEmail(event)">
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <button type="submit" class="login-btn">Login</button>
            </form>
            
            <p class="signup-link">Don't have an account? <a href="#signup" onclick="toggleSignup()">Sign up here</a></p>
        </div>
    </div>
    
    <!-- Signup Modal -->
    <div id="signupModal" class="modal hidden">
        <div class="modal-content">
            <span class="close" onclick="toggleSignup()">&times;</span>
            <h2>Create Your HiHey Account</h2>
            <form onsubmit="signupUser(event)">
                <input type="text" placeholder="Full Name" required>
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <input type="password" placeholder="Confirm Password" required>
                <button type="submit" class="btn-primary">Sign Up</button>
            </form>
        </div>
    </div>
    
    <script src="auth.js"></script>
</body>
</html>
